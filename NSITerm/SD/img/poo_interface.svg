<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>
.t{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:15px;fill:#222}
.m{font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;font-size:14px;fill:#222}
.b{font-weight:bold}
.w{fill:#fff}
.n{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:13px;fill:#555;font-style:italic}
.g{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:12px;fill:#777}
.cls{fill:#e8f1f5;stroke:#1a5f7a;stroke-width:2}
.clsh{fill:#1a5f7a}
.obj{fill:#fdf3e1;stroke:#b7791f;stroke-width:2}
.objh{fill:#b7791f}
.var{fill:#f0f0f0;stroke:#555;stroke-width:1.5}
.lst{fill:#eaf5ea;stroke:#3a7d44;stroke-width:1.5}
.fl{stroke:#333;stroke-width:1.8;fill:none;marker-end:url(#fl)}
.fld{stroke:#1a5f7a;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#fl)}
</style>
<rect width="100%" height="100%" fill="#fff" rx="8"/>
<text class="t b" x="30" y="115">Code client</text>
<rect x="30" y="125" width="250" height="110" rx="4" fill="#f6f6f6" stroke="#bbb"/>
<text class="m" x="42" y="155">def vider(f):</text>
<text class="m" x="68" y="180">while not f.est_vide():</text>
<text class="m" x="102" y="205">f.defiler()</text>

<path class="fl" d="M282,180 L326,180"/>

<rect class="cls" x="330" y="60" width="170" height="250" rx="4"/>
<rect class="clsh" x="330" y="60" width="170" height="38" rx="4"/>
<text class="t b w" x="415" y="85" text-anchor="middle">Interface</text>
<text class="m" x="415" y="160" text-anchor="middle">est_vide()</text>
<text class="m" x="415" y="190" text-anchor="middle">enfiler(x)</text>
<text class="m" x="415" y="220" text-anchor="middle">defiler()</text>
<text class="n" x="415" y="285" text-anchor="middle">ce que voit</text>
<text class="n" x="415" y="302" text-anchor="middle">le client</text>

<text class="t b" x="580" y="30">Implémentations (cachées)</text>
<rect x="580" y="45" width="290" height="125" rx="4" fill="#f6f6f6" stroke="#777" stroke-dasharray="6 4"/>
<text class="t b" x="595" y="72">FileListe</text>
<text class="m" x="595" y="100">_contenu : list</text>
<text class="n" x="595" y="130">defiler utilise pop(0) :</text>
<text class="n" x="595" y="148">coût linéaire</text>

<rect x="580" y="200" width="290" height="140" rx="4" fill="#f6f6f6" stroke="#777" stroke-dasharray="6 4"/>
<text class="t b" x="595" y="227">File</text>
<text class="m" x="595" y="255">_entree : Pile</text>
<text class="m" x="595" y="278">_sortie : Pile</text>
<text class="n" x="595" y="305">defiler transfère les piles :</text>
<text class="n" x="595" y="323">coût constant amorti</text>

<path class="fl" d="M502,160 L576,110"/>
<path class="fl" d="M502,210 L576,268"/>

<text class="n" x="30" y="372">Le client n'utilise que les méthodes de l'interface : on peut changer d'implémentation sans modifier son code.</text>
</svg>
