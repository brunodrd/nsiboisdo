<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>
.t{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:15px;fill:#222}
.m{font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;font-size:14px;fill:#222}
.b{font-weight:bold}
.w{fill:#fff}
.n{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:13px;fill:#555;font-style:italic}
.g{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;font-size:12px;fill:#777}
.cls{fill:#e8f1f5;stroke:#1a5f7a;stroke-width:2}
.clsh{fill:#1a5f7a}
.obj{fill:#fdf3e1;stroke:#b7791f;stroke-width:2}
.objh{fill:#b7791f}
.var{fill:#f0f0f0;stroke:#555;stroke-width:1.5}
.lst{fill:#eaf5ea;stroke:#3a7d44;stroke-width:1.5}
.fl{stroke:#333;stroke-width:1.8;fill:none;marker-end:url(#fl)}
.fld{stroke:#1a5f7a;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#fl)}
</style>
<rect width="100%" height="100%" fill="#fff" rx="8"/>
<text class="t b" x="40" y="30">Classe (le plan)</text>
<rect class="cls" x="40" y="45" width="320" height="200" rx="4"/>
<rect class="clsh" x="40" y="45" width="320" height="38" rx="4"/>
<text class="t b w" x="200" y="70" text-anchor="middle">Carte</text>
<text class="g" x="52" y="103">attributs</text>
<text class="m" x="70" y="126">valeur</text>
<text class="m" x="70" y="148">couleur</text>
<line x1="40" y1="162" x2="360" y2="162" stroke="#1a5f7a" stroke-width="1.5"/>
<text class="g" x="52" y="182">méthodes</text>
<text class="m" x="70" y="205">__init__(self, valeur, couleur)</text>
<text class="m" x="70" y="228">est_plus_forte_que(self, autre)</text>

<text class="t b" x="500" y="30">Objets (instances)</text>
<rect class="obj" x="500" y="45" width="210" height="95" rx="4"/>
<rect class="objh" x="500" y="45" width="210" height="30" rx="4"/>
<text class="t w" x="605" y="66" text-anchor="middle">objet Carte</text>
<text class="m" x="515" y="100">valeur = 12</text>
<text class="m" x="515" y="125">couleur = '♥'</text>

<rect class="obj" x="500" y="185" width="210" height="95" rx="4"/>
<rect class="objh" x="500" y="185" width="210" height="30" rx="4"/>
<text class="t w" x="605" y="206" text-anchor="middle">objet Carte</text>
<text class="m" x="515" y="240">valeur = 14</text>
<text class="m" x="515" y="265">couleur = '♠'</text>

<path class="fld" d="M362,105 L496,92"/>
<text class="m" x="368" y="88" style="font-size:13px;fill:#1a5f7a">Carte(12, '♥')</text>
<path class="fld" d="M362,195 L496,230"/>
<text class="m" x="368" y="248" style="font-size:13px;fill:#1a5f7a">Carte(14, '♠')</text>

<rect class="var" x="770" y="76" width="50" height="32" rx="4"/>
<text class="m b" x="795" y="97" text-anchor="middle">c1</text>
<path class="fl" d="M768,92 L714,92"/>
<rect class="var" x="770" y="216" width="50" height="32" rx="4"/>
<text class="m b" x="795" y="237" text-anchor="middle">c2</text>
<path class="fl" d="M768,232 L714,232"/>

<text class="n" x="40" y="310">Chaque objet possède ses propres valeurs d'attributs ; les méthodes sont écrites une seule fois, dans la classe.</text>
</svg>
